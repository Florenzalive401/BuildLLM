name: Course feedback
description: Report unclear, missing, or incorrect BuildLLM learning material.
title: "[Course]: "
labels:
  - documentation
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson or guide
      description: Provide the filename and section heading.
      placeholder: course/04_TOKENIZER_AND_DATASET.md — Stop and check
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: learner
    attributes:
      label: Learner context
      description: Describe the background or hardware that made this difficult, if relevant.
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
