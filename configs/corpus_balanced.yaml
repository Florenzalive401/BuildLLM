version: 1
seed: 1729

output:
  corpus: data/processed/training_corpus_balanced.jsonl
  report: data/reports/training_corpus_balanced_report.json

limits:
  maximum_characters: 1000000000

quality:
  minimum_score: 55
  minimum_characters: 500
  maximum_characters: 2000000

balancing:
  enabled: true
  overflow_factor: 1.15
  topic_weights:
    general: 0.20
    technology: 0.12
    cybersecurity: 0.08
    science: 0.12
    mathematics: 0.08
    history: 0.10
    government: 0.07
    business: 0.07
    health: 0.05
    arts_and_culture: 0.06
    geography: 0.05

deduplication:
  near_duplicates: true
  maximum_hamming_distance: 3

sources:
  # Uses the clean Simple Wikipedia file you already built. Change the path to
  # wikipedia_en.jsonl after building the full English Wikipedia source.
  - name: wikipedia
    type: jsonl
    enabled: true
    path: data/processed/wikipedia_simple.jsonl
    text_field: text
    title_field: title
    id_field: page_id
    license: CC BY SA 4.0 and GFDL
    target_characters: 350000000
    minimum_quality_score: 50

  - name: fineweb_edu
    type: huggingface
    enabled: true
    dataset: HuggingFaceFW/fineweb-edu
    configuration: sample-10BT
    split: train
    text_fields: [text]
    title_fields: [title]
    id_fields: [id, url]
    license: ODC By 1.0
    target_characters: 350000000
    # This is only the streaming shuffle window. It is not a document limit.
    shuffle_buffer: 10000
    seed: 42
    minimum_quality_score: 60

  - name: rfc
    type: rfc
    enabled: true
    cache_directory: data/raw/rfc
    include_obsolete: false
    license: IETF Trust Legal Provisions
    target_characters: 50000000
    minimum_quality_score: 45

  # These are ready to enable after the first complete run. They use streaming,
  # so the full remote datasets are not downloaded before processing begins.
  - name: gutenberg
    type: huggingface
    enabled: false
    dataset: zkeown/gutenberg-corpus
    split: train
    text_fields: [text, content, book_text]
    title_fields: [title]
    id_fields: [id, book_id]
    license: Public domain and source specific Project Gutenberg terms
    target_characters: 100000000
    minimum_quality_score: 58

  - name: stackexchange
    type: huggingface
    enabled: false
    dataset: common-pile/stackexchange
    split: train
    text_fields: [text, content, body]
    title_fields: [title]
    id_fields: [id, url]
    license: CC BY SA, version varies by post date
    target_characters: 100000000
    minimum_quality_score: 58
